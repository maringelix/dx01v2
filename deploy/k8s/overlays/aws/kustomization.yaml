# EKS lab cluster of tx01v2, HTTP only (contract default). Rendered and applied by
# scripts/deploy-aws.sh from a temporary copy that contains components/aws/params.env.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dx01v2
resources:
  - ../../base
components:
  - ../../components/aws
