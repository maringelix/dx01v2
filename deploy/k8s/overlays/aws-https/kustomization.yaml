# Same as overlays/aws plus the HTTPS listener; chosen by scripts/deploy-aws.sh when the repository
# variable ALB_CERTIFICATE_ARN (an ACM certificate in the lab region) is set.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dx01v2
resources:
  - ../../base
components:
  - ../../components/aws
  - ../../components/aws-https
