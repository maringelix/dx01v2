# Same as overlays/aws plus the HTTPS listener; chosen by scripts/deploy-aws.sh when the repository
# DNS and ACM are enabled in the tx01v2 SSM contract.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dx01v2
resources:
  - ../../base
  - gitops-revision.yaml
components:
  - ../../components/aws
  - ../../components/aws-https
