# Observability of the app on the local platform: Prometheus scrapes the metrics port of the API
# (prom-client: http_request_duration_seconds by method, route and status_code) and evaluates the
# alerts below; Alertmanager delivers them to the alert sink of tx01v2. v1 had alert rules for series
# that did not exist (docs/LICOES_APRENDIDAS.md of tx01v2, 7.4): every rule here uses a series the API
# or kube-state-metrics exports, and the harness tests them with promtool (check promtool-rules).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: api
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: dx01v2
spec:
  groups:
    - name: dx01v2
      rules:
        - alert: Dx01v2ApiDown
          expr: absent(up{namespace="dx01v2", service="api"} == 1)
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: No API pod of dx01v2 is being scraped successfully
        - alert: Dx01v2HighErrorRate
          expr: |
            sum(rate(http_request_duration_seconds_count{namespace="dx01v2", status_code=~"5.."}[5m]))
              / sum(rate(http_request_duration_seconds_count{namespace="dx01v2"}[5m])) > 0.05
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: More than 5% of the API responses are 5xx
        - alert: Dx01v2HighLatencyP95
          expr: |
            histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{namespace="dx01v2"}[5m]))) > 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: The API p95 latency is above 1 second
        - alert: Dx01v2PodRestarting
          expr: increase(kube_pod_container_status_restarts_total{namespace="dx01v2"}[15m]) > 2
          labels:
            severity: warning
          annotations:
            summary: A container of dx01v2 restarted more than twice in 15 minutes
        - alert: Dx01v2PodNotReady
          expr: sum by (pod) (kube_pod_status_ready{namespace="dx01v2", condition="true"}) == 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: A pod of dx01v2 has not been ready for 5 minutes
