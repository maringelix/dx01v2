# Edge of the local lab: a Gateway API Gateway of class istio (the local twin of the ALB of the AWS
# Load Balancer Controller), exposed by the load balancer emulator of tx01v2. HTTPS with a certificate
# cert-manager issues from the ClusterIssuer lab-ca (the local twin of ACM); HTTP only redirects.
# /api goes straight to the API, like the ALB rule; everything else to web (nginx).
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: dx01v2
  annotations:
    cert-manager.io/cluster-issuer: lab-ca
spec:
  gatewayClassName: istio
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: dx01v2.tx01v2.local
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      hostname: dx01v2.tx01v2.local
      allowedRoutes:
        namespaces:
          from: Same
      tls:
        mode: Terminate
        certificateRefs:
          - name: dx01v2-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dx01v2-redirect
spec:
  parentRefs:
    - name: dx01v2
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dx01v2
spec:
  parentRefs:
    - name: dx01v2
      sectionName: https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: api
          port: 3000
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: web
          port: 8080
