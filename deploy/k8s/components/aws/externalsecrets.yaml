# Contract v1: External Secrets Operator (installed by tx01v2) copies Secrets Manager values into
# the Secrets the pods read. The deployer role may only read Secrets; ESO writes them.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: db-credentials
    creationPolicy: Owner
  data:
    - secretKey: DB_HOST
      remoteRef:
        key: tx01v2-lab/db/app
        property: host
    - secretKey: DB_PORT
      remoteRef:
        key: tx01v2-lab/db/app
        property: port
    - secretKey: DB_NAME
      remoteRef:
        key: tx01v2-lab/db/app
        property: dbname
    - secretKey: DB_USER
      remoteRef:
        key: tx01v2-lab/db/app
        property: username
    - secretKey: DB_PASSWORD
      remoteRef:
        key: tx01v2-lab/db/app
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: app-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: app-secrets
    creationPolicy: Owner
  data:
    - secretKey: ADMIN_TOKEN
      remoteRef:
        key: tx01v2-lab/app/admin-token
