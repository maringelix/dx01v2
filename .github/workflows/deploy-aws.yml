# Deploys dx01v2 to the EKS lab cluster of tx01v2 (contract v1, docs/CONTRATO.md). CLOUD-MUTATING
# and billable (ECR images, an internet-facing ALB): dispatch manually after the tx01v2 apply and
# platform workflows; tear down with the tx01v2 destroy. The `lab` environment (required reviewer,
# main only) gates the OIDC role dx01v2-gha-deploy. Not run in the cloud yet (v2).
# Every step of the deploy lives in scripts/deploy-aws.sh, the same script a laptop runs.
name: deploy-aws

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dx01v2-lab-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: lab
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ALB_CERTIFICATE_ARN: ${{ vars.ALB_CERTIFICATE_ARN }}
      SMOKE_BASE_URL: ${{ vars.SMOKE_BASE_URL }}
    steps:
      - name: Check repository variables
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          missing=()
          for v in AWS_REGION AWS_DEPLOY_ROLE_ARN; do
            [[ -n "${!v}" ]] || missing+=("$v")
          done
          if [[ -n "$ALB_CERTIFICATE_ARN" && "$SMOKE_BASE_URL" != https://* ]]; then
            missing+=("SMOKE_BASE_URL (https://<DNS name of the certificate>, required with ALB_CERTIFICATE_ARN)")
          fi
          if ((${#missing[@]} > 0)); then
            echo "::error::Missing repository variables: ${missing[*]}. Settings > Secrets and variables > Actions > Variables; see docs/RUNBOOK.md (section 'Variáveis do GitHub')."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: dx01v2-deploy-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true

      - name: Install kubectl (pinned, SHA256-verified)
        run: bash scripts/install-tools.sh kubectl

      - name: Deploy (scripts/deploy-aws.sh)
        env:
          GIT_SHA: ${{ github.sha }}
        run: bash scripts/deploy-aws.sh
