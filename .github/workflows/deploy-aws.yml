# Cloud-mutating and billable: promotes a signed GHCR release to ECR and deploys it to EKS.
# Dispatch from main with the run id of a successful publish-images run. The release is fully
# verified before the lab environment approval and again before AWS credentials are requested.
name: deploy-aws

on:
  workflow_dispatch:
    inputs:
      release_run_id:
        description: Successful publish-images workflow run id for the release to deploy
        required: true
        type: string
      deploy_mode:
        description: Use Argo CD when available, or force a deployment path
        required: true
        default: auto
        type: choice
        options:
          - auto
          - gitops
          - push

permissions:
  contents: read

concurrency:
  group: dx01v2-lab-deploy
  cancel-in-progress: false

jobs:
  verify-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      attestations: read
      contents: read
      packages: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_RUN_ID: ${{ inputs.release_run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve the publisher run and release artifact
        id: release
        run: bash scripts/get-publish-run-metadata.sh

      - name: Download the immutable release bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ steps.release.outputs.artifact_name }}
          run-id: ${{ inputs.release_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/dx01v2-release

      - name: Verify source CI, image digests, SBOM checksums, and attestations
        env:
          RELEASE_DIR: ${{ runner.temp }}/dx01v2-release
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
        run: bash scripts/verify-release-bundle.sh

      - name: Preserve the verified bundle for the approved deploy job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dx01v2-verified-release
          path: ${{ runner.temp }}/dx01v2-release/
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: verify-release
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: lab
    permissions:
      actions: read
      attestations: read
      contents: write
      id-token: write
      packages: read
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      DEPLOY_MODE: ${{ inputs.deploy_mode }}
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      RELEASE_RUN_ID: ${{ inputs.release_run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Download the previously verified release bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dx01v2-verified-release
          path: ${{ runner.temp }}/dx01v2-release

      - name: Re-verify the bundle and signer before requesting AWS credentials
        env:
          RELEASE_DIR: ${{ runner.temp }}/dx01v2-release
        run: bash scripts/verify-release-bundle.sh

      - name: Check repository variables
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          missing=()
          for v in AWS_REGION AWS_DEPLOY_ROLE_ARN; do
            [[ -n "${!v}" ]] || missing+=("$v")
          done
          if ((${#missing[@]} > 0)); then
            echo "::error::Missing repository variables: ${missing[*]}. Settings > Secrets and variables > Actions > Variables; see docs/RUNBOOK.md."
            exit 1
          fi

      - name: Authenticate to GHCR for the verified image digests
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: dx01v2-deploy-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true

      - name: Install pinned kubectl
        run: bash scripts/install-tools.sh kubectl

      - name: Promote the verified images and deploy (no rebuild)
        env:
          RELEASE_DIR: ${{ runner.temp }}/dx01v2-release
        run: bash scripts/deploy-aws.sh

      - name: Remove registry credentials
        if: always()
        run: |
          if ! docker logout ghcr.io; then
            echo '::warning::Could not remove GHCR credentials from this runner.'
          fi
          if [[ -n "${AWS_REGION:-}" ]]; then
            aws_account_id="$(aws sts get-caller-identity --query Account --output text 2>/dev/null)" || aws_account_id=""
            if [[ -n "$aws_account_id" ]]; then
              if ! docker logout "$aws_account_id.dkr.ecr.$AWS_REGION.amazonaws.com" >/dev/null 2>&1; then
                echo '::warning::Could not remove ECR credentials from this runner.'
              fi
            fi
          fi
