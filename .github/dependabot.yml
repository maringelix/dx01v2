# Monthly dependency PRs: minor + patch grouped per ecosystem, majors one by one.
# Review procedure: AGENTS.md (Dependency updater) and docs/SUSTENTACAO.md.
# Harness tools (tools/), the postgres:17-alpine and kind node digests (compose.yaml, ci.yml,
# deploy/k8s, scripts/harness.sh, kind/kind-config.yaml) and the devcontainer are updated by hand
# in the quarterly routine: they must change together (check version-consistency).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      # @types/node follows the Node.js major of .nvmrc (24), not the latest Node.js release.
      - dependency-name: '@types/node'
        update-types:
          - version-update:semver-major

  - package-ecosystem: docker
    directories:
      - /api
      - /web
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      docker-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      github-actions-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      pre-commit-minor-patch:
        update-types:
          - minor
          - patch
